# Runs the unit tests and builds the APK on every push and pull request.
# - Pushes to main update the "latest" pre-release, so the newest APK is always
#   one tap away on the phone.
# - Tags (for example rt8 and demo) get a permanent release of their own.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: write

# One build per branch at a time, so two quick merges to main cannot update
# the "latest" release at the same moment. On main a new build waits for the
# running one (if several wait, only the newest runs). In a pull request a new
# push stops the old, unneeded build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # A fixed Ubuntu version, so the build machine stays the same through RT8
    # (5.11.) and the fair (27.11.). GitHub moves "ubuntu-latest" to Ubuntu 26
    # from 19.10.2026 on. After the course, ubuntu-latest is fine again.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Android's own checks for bugs (for example Compose state, API levels, resources).
      # The findings are printed here (textReport in app/build.gradle.kts), so they
      # can be read without Android Studio. Errors fail the build, warnings do not.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk distraction-killer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: distraction-killer-apk
          path: distraction-killer.apk

      - name: Update the "latest" pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest distraction-killer.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Uusin versio (build ${{ github.run_number }})" \
            --notes "Uusin main-haaran build. Avaa puhelimella ja asenna distraction-killer.apk."

      - name: Release a tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" distraction-killer.apk \
            --title "$GITHUB_REF_NAME (build ${{ github.run_number }})" \
            --notes "Jäädytetty versio $GITHUB_REF_NAME."
